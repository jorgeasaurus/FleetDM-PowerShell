# Jekyll configuration for GitHub Pages.
# Layouts, CSS, and navigation live in this repository. pages.yml builds
# this config with actions/jekyll-build-pages. Do not replace this file
# during the Documentation workflow.
title: FleetDM-PowerShell
description: PowerShell module for the Fleet REST API. Install, connect, common tasks, and the cmdlet reference.
version: "2.2.0"
baseurl: "/FleetDM-PowerShell"
url: "https://jorgeasaurus.github.io"

plugins:
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-optional-front-matter

include:
  - README.md
  - CONTRIBUTING.md
  - LICENSE
  - docs
  - en-US

exclude:
  - "*.ps1"
  - "*.psm1"
  - "*.psd1"
  - Tests/
  - Private/
  - Public/
  - Output/
  - build/
  - vendor/
  - .jekyll-cache/
  - .github/workflows/documentation.yml

relative_links:
  enabled: true
  collections: true

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
    values:
      layout: default
