name: Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'Public/**'
      - 'docs/**'
      - '*.md'
      - '.github/workflows/documentation.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Public/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PowerShell
      shell: pwsh
      run: |
        # Install required modules
        Install-Module -Name PlatyPS -Force -Scope CurrentUser
        Install-Module -Name PowerShellGet -Force -Scope CurrentUser -AllowClobber
    
    - name: Generate Documentation
      shell: pwsh
      run: |
        # Import module
        Import-Module ./FleetDM-PowerShell.psd1 -Force
        
        # Generate/Update markdown documentation
        $docsPath = "./docs/en-US"
        if (!(Test-Path $docsPath)) {
            New-Item -Path $docsPath -ItemType Directory -Force
        }
        
        # Generate help for each command
        Get-Command -Module FleetDM-PowerShell | ForEach-Object {
            New-MarkdownHelp -Command $_.Name -OutputFolder $docsPath -Force
        }
        
        # Generate module page
        New-MarkdownHelp -Module FleetDM-PowerShell -OutputFolder $docsPath -WithModulePage -Force
        
        # PlatyPS leaves a Liquid-looking placeholder. Jekyll would treat it as a tag.
        Get-ChildItem $docsPath -Filter *.md | ForEach-Object {
            $text = [System.IO.File]::ReadAllText($_.FullName)
            $updated = $text.Replace('{{ Fill ProgressAction Description }}', 'ProgressAction is a PowerShell common parameter.')
            if ($updated -ne $text) {
                [System.IO.File]::WriteAllText($_.FullName, $updated)
            }
        }

        # Generate external help
        New-ExternalHelp -Path $docsPath -OutputPath ./en-US -Force
    
    - name: Upload Documentation Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: |
          docs/
          en-US/
    
    - name: Commit Documentation Updates
      if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add docs/ en-US/
        git diff --staged --quiet || git commit -m "Update documentation [skip ci]"
        git push || echo "No changes to push"

  build-docs-site:
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Pages
      uses: actions/configure-pages@v5

    # Build the repository Jekyll site. Do not overwrite _config.yml or index.md.
    - name: Build with Jekyll
      uses: actions/jekyll-build-pages@v1
      with:
        source: ./
        destination: ./_site

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4